<!-- Extends the layout from /app/views/layout.html -->
{% extends 'layout-dhsc-dev.html' %}
<!--
  In /app/views/layout.html you can:
    - change the header and footer
    - add custom CSS and JavaScript
-->

<!--
  Use this to set the page name which will appear at the
  start of the <title> tag, followed by the service name.
  This is often not needed on the homepage, where only the
  service name is needed. You can also reuse this variable
  within the <h1>, where they are the same.
-->
{% set pageName = "Product Details" %}

<!-- For adding a breadcrumb or back link -->
<!-- Code examples can be found at https://service-manual.nhs.uk/design-system/components/breadcrumbs and https://service-manual.nhs.uk/design-system/components/back-link -->
{% block beforeContent %}
<!-- {{
    backLink({
        href: "/v8/dhsc/comparator-search",
        text: "Back"
    })
}} -->
{% endblock %}

<!-- For adding page content -->
<!-- Page layout code can be found at https://service-manual.nhs.uk/design-system/styles/layout -->
{% block content %}
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-two-thirds">
        <span class="nhsuk-caption-l">Metabet SR 1000mg tablets (Morningside Healthcare Ltd)(28 tablet - 2 x 14
            tablets)</span>
        <h1>Enter comparator details</h1>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="one-third">
            Year of comparator price
          </label>
          <input class="nhsuk-input nhsuk-input--width-4 nhsuk-date-input__input" id="comparator-year" name="comparatorYear" type="text">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="cost-pounds">
            Comparator price
          </label>
          <div class="nhsuk-input-wrapper">
            <div class="nhsuk-input-wrapper__prefix" aria-hidden="true">£</div>
            <input class="nhsuk-input nhsuk-input--width-5" id="cost-pounds" name="costPounds" type="text"
              spellcheck="false">
          </div>
        </div>


        <div class="nhsuk-button-group">
            <button id="save-compare" class="nhsuk-button">
          Save changes
            </button>
            <a href="/v8/dhsc/comparator-search" class="nhsuk-button nhsuk-button--secondary">
          Cancel
            </a>
        </div>

        <!-- End of content -->

    </div>
</div>


<script>
  (function () {
    const saveBtn = document.getElementById('save-compare');
    if (!saveBtn) return;
  
    saveBtn.addEventListener('click', function (e) {
      e.preventDefault();
  
      sessionStorage.setItem(
            'lastEditedField',
            'comparator-information'
        );

        sessionStorage.setItem(
            'bannerAction',
            'updated'
        );
  
      const activeTab =
        sessionStorage.getItem('activeTab') ||
        '#ref-price-information';
  
      window.location.href =
        '/v8/dhsc/product-details?saved=true&tab=' +
        encodeURIComponent(activeTab);
    });
  }());
  </script>
{% endblock %}
