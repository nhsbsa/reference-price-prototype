{% extends 'layout-dhsc.html' %}
{% set pageName = "Confirm change" %}

{% block beforeContent %}


{% endblock %}

{% block content %}
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-two-thirds">
        <span class="nhsuk-caption-l">Loss of exclusivity</span>
        <h1 id="product-name" class="nhsuk-heading-xl">Metabet SR 1000mg tablets (Morningside Healthcare Ltd)(28 tablet - 2 x 14 tablets)</h1>

        <div id="confirmation-content"></div>

        <div class="nhsuk-button-group">
            <button id="confirm-btn" class="nhsuk-button" type="button">Save</button>
            <button id="cancel-btn" class="nhsuk-button nhsuk-button--secondary" type="button">Cancel</button>
        </div>
    </div>
</div>

<script>
(function () {
    const fieldMetadata = {
        "cdr-market-authorisation-holder": {
            label: "(CDR) market authorisation holder",
            calloutHeading: "Changing the (CDR) market authorisation holder",
            calloutContent: "Changing the (CDR) market authorisation holder will affect all products linked to the Virtual Therapeutic Moiety (VTM) 'Metformin'."
        },
        "cdr-spc-holder": {
            label: "(CDR) Supplementary Protection Certificate (SPC) holder",
            calloutHeading: "Changing the (CDR) SPC holder",
            calloutContent: "Changing the (CDR) SPC holder for SPC number xxxx will affect all products linked to the VTM 'Metformin'."
        }
    };

    const params = new URLSearchParams(window.location.search);
    const fieldKey = params.get('field') || 'cdr-market-authorisation-holder';
    const newValue = params.get('companyName') || '';
    const metadata = fieldMetadata[fieldKey] || fieldMetadata['cdr-market-authorisation-holder'];

    if (fieldKey === 'cdr-market-authorisation-holder') {

    sessionStorage.setItem(
        'bannerHeading',
        'VTM Market Authorisation information'
    );

    } else if (fieldKey === 'cdr-spc-holder') {

    sessionStorage.setItem(
        'bannerHeading',
        'VTM Supplementary Protection Certificate information'
    );

    }

    // Build confirmation content
    const calloutHtml = `
      <div class="nhsuk-card nhsuk-card--warning nhsuk-u-margin-bottom-2">
        <div class="nhsuk-card__content">
          <h3 class="nhsuk-card__heading">
            <span role="text">
              <span class="nhsuk-u-visually-hidden">Important:</span> ${metadata.calloutHeading}
            </span>
          </h3>
          <p class="nhsuk-card__description">${metadata.calloutContent}</p>
        </div>
      </div>
    `;

    const manualCompany = params.get('manualCompany') === 'true';

    const displayLabel =
    metadata.label.replace('(SPC) ', '');

    const confirmText =
        `Changing ${displayLabel} for the VTM 'Metformin' will update all linked products.`;

    const manualCompanyText =
        `This will change the <strong>${displayLabel}</strong> for all products linked to the Virtual Therapeutic Moiety (VTM) 'Metformin'.`;

    const confirmationHtml = manualCompany ? `
      <div class="nhsuk-u-margin-top-4">
        <h2 class="nhsuk-heading-m">Enter a new company name</h2>

        <p>${manualCompanyText}</p>

        <p>Current company name: <strong>Morningside Healthcare Ltd</strong></p>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="company-name">
            New company name
          </label>
          <input
            class="nhsuk-input nhsuk-u-width-two-thirds"
            id="company-name"
            name="companyName"
            type="text"
            value="${newValue}">
        </div>
      </div>
    ` : `
      <div class="nhsuk-u-margin-top-4">

        <h2 class="nhsuk-heading-m">
          Confirm change of ${displayLabel}
        </h2>

        <p>${confirmText}</p>

        <dl class="nhsuk-summary-list">
          <div class="nhsuk-summary-list__row">
            <dt class="nhsuk-summary-list__key">Previous company name</dt>
            <dd class="nhsuk-summary-list__value">Morningside Healthcare Ltd</dd>
          </div>

          <div class="nhsuk-summary-list__row">
            <dt class="nhsuk-summary-list__key">New company name</dt>
            <dd class="nhsuk-summary-list__value">${newValue}</dd>
          </div>
        </dl>

      </div>
    `;

    document.getElementById('confirmation-content').insertAdjacentHTML('afterbegin', confirmationHtml);

    // Save button handler
    document.getElementById('confirm-btn').addEventListener('click', function () {

    sessionStorage.setItem('lastEditedFieldLabel', displayLabel);
    sessionStorage.setItem('bannerFieldLabel', displayLabel);

    if (fieldKey === 'cdr-market-authorisation-holder') {

        sessionStorage.setItem(
            'bannerHeading',
            'VTM Market Authorisation information'
        );

    } else if (fieldKey === 'cdr-spc-holder') {

        sessionStorage.setItem(
            'bannerHeading',
            'VTM Supplementary Protection Certificate information'
        );

    }

    if (manualCompany) {

    sessionStorage.setItem('bannerTab', 'New company name added');
    sessionStorage.setItem('newCompanyAdded', 'true');

    } else {

    sessionStorage.setItem('bannerTab', 'Updated');
    sessionStorage.removeItem('newCompanyAdded');

    }

    const tab = '#exclusivity-information';

    window.location.href =
        '/v5/dhsc/product-details?saved=true&tab=' +
        encodeURIComponent(tab);

    });

    // Cancel button handler - go back to search
    document.getElementById('cancel-btn').addEventListener('click', function () {
        window.location.href = 'javascript:history.go(-1)';
    });
}());
</script>

{% endblock %}
